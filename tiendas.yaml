# Tiendas peruanas de Pokémon TCG a escanear.
# Tipos soportados:
#   woocommerce -> usa la API pública /wp-json/wc/store/v1 (categorias = slugs de categoría)
#   shopify     -> usa /collections/<handle>/products.json (colecciones = handles)
#   magento     -> lee el HTML de las páginas de categoría (urls = páginas de listado)
#   vtex        -> API pública de búsqueda de VTEX (buscar = términos de búsqueda)
#   falabella   -> buscador de falabella.com.pe (buscar = términos; max_paginas de 48)
#   ripley      -> buscador de simple.ripley.com.pe (buscar = términos; max_paginas de 48)
# "filtro" (opcional): solo guarda productos cuyo nombre contenga alguna de estas palabras.
#   Con una lista de listas, el nombre debe tener una palabra de CADA lista.
# "excluir" (opcional): descarta productos cuyo nombre contenga alguna de estas palabras.
# Las palabras se comparan sin tildes ni mayúsculas, al inicio de palabra ("sobre" = "sobres").
# "activa: false" desactiva una tienda sin borrarla.

# Filtro para tiendas grandes que venden de todo: Pokémon (o "TCG", ya que se busca
# "pokemon tcg") + algo de TCG, sin juguetes, ropa, accesorios ni otros juegos de cartas.
filtro_tcg: &filtro_tcg
  - [pokemon, tcg]
  - [tcg, booster, sobre, elite trainer, etb, blister, display, mini tin, tin, lata, coleccion,
     collection, deck, mazo, carta, premium, bundle, battle, pack, caja]
excluir_tcg: &excluir_tcg
  [peluche, figura, funko, llavero, mochila, polo, taza, consola, nintendo, switch, videojuego,
   lonchera, taper, tomatodo, disfraz, pijama, lego, construx, cartuchera, audifono, cuaderno,
   album cartas, album para, album pokemon, pocket, folios, ultra pro, portafolio, folder, carpeta, toploader, deck box, playmat, tapete,
   magic, mtg, yugioh, yu gi oh, one piece, digimon, lorcana, dragon ball, union arena, lampara, reloj, gorra, casaca, zapatilla, sandalia, toalla, manta, cojin, pinata,
   globo, vaso, plato, termo, mouse, alfombra, fundas, micas, protector, sleeves, replica, proxy,
   doradas, metalicas, generica, juguete, pistola, lanzador, pokebola, poke ball]

tiendas:
  - nombre: OkamiDex
    tipo: woocommerce
    url: https://okamidex.pe
    categorias: [pokemon-tcg]

  - nombre: Ludus Magnus
    tipo: woocommerce
    url: https://ludusmagnusperu.com
    categorias: [pokemon, preventas-pokemon]

  - nombre: La Mazmorra TCG
    tipo: woocommerce
    url: https://lamazmorratcg.com
    categorias: [pokemon-tcg]

  - nombre: Replay Perú
    tipo: shopify
    url: https://replayperu.com
    # "tcg-pokemon" quedó vacía (nov 2026); el TCG está repartido en estas colecciones.
    # Si Shopify limita el JSON (HTTP 429), el escáner lee el HTML de la colección.
    colecciones: [pokemon-general, tcggeneral, preventa-1, preventa-tcg, 30-aniversario-pokemon, dominio-delta-pokemon]
    filtro: [pokemon, pokémon]
    excluir: [funko, peluche, figura, llavero, mochila, polo, taza, cartera, loungefly, moncolle, armable, bandai]
    pausa: 8   # segundos entre peticiones; Shopify bloquea 60 s si van muy seguidas

  - nombre: Phantom
    tipo: magento
    url: https://phantom.pe
    urls:
      - https://phantom.pe/cartas-coleccionables/pokemon-trading-cards.html
      - https://phantom.pe/coleccionables-figuras/pokemon-trading-card-game.html

  # Tiendas por departamento y supermercados (venden de todo: se filtra solo el TCG).
  - nombre: Falabella
    tipo: falabella
    url: https://www.falabella.com.pe
    buscar: [pokemon tcg]   # incluye Saga, Sodimac, Tottus y vendedores del marketplace
    max_paginas: 13
    filtro: *filtro_tcg
    excluir: *excluir_tcg

  - nombre: Ripley
    tipo: ripley
    url: https://simple.ripley.com.pe
    buscar: [pokemon tcg]
    max_paginas: 10
    filtro: *filtro_tcg
    excluir: *excluir_tcg

  - nombre: Plaza Vea
    tipo: vtex
    url: https://www.plazavea.com.pe
    buscar: [pokemon tcg]
    filtro: *filtro_tcg
    excluir: *excluir_tcg

  - nombre: Oechsle
    tipo: vtex
    url: https://www.oechsle.pe
    buscar: [pokemon tcg]
    filtro: *filtro_tcg
    excluir: *excluir_tcg

  - nombre: Promart
    tipo: vtex
    url: https://www.promart.pe
    buscar: [pokemon tcg]
    filtro: *filtro_tcg
    excluir: *excluir_tcg

  - nombre: Wong
    tipo: vtex
    url: https://www.wong.pe
    buscar: [pokemon tcg]
    filtro: *filtro_tcg
    excluir: *excluir_tcg

  - nombre: Metro
    tipo: vtex
    url: https://www.metro.pe
    buscar: [pokemon tcg]
    filtro: *filtro_tcg
    excluir: *excluir_tcg

  - nombre: Shopstar
    tipo: vtex
    url: https://shopstar.pe
    buscar: [pokemon tcg]
    filtro: *filtro_tcg
    excluir: *excluir_tcg

  # Mercado Libre: la API pide token. Usa ML_CLIENT_ID y ML_CLIENT_SECRET de tu app de
  # developers.mercadolibre.com.pe (variables de entorno en tu PC, secrets en GitHub).
  # Nov 2026: el token se obtiene bien, pero /sites/MPE/search responde 403 igual (Mercado
  # Libre cerró la búsqueda a apps). Queda desactivada; probar "activa: true" si la reabren.
  - nombre: Mercado Libre
    tipo: mercadolibre
    url: https://www.mercadolibre.com.pe
    buscar: [pokemon tcg]
    max_resultados: 1000
    filtro: *filtro_tcg
    excluir: *excluir_tcg
    activa: false

  # eBay (EE. UU.): API oficial con EBAY_CLIENT_ID y EBAY_CLIENT_SECRET de developer.ebay.com.
  # Solo cartas Pokémon GRADEADAS, "Cómpralo ya", con envío GRATIS a Perú y vendedores con
  # 98%+ de reputación y 100+ votos. Hasta US$ 200: en Perú las compras por courier de hasta
  # US$ 200 no pagan impuestos de importación. Poner "activa: true" cuando estén las claves.
  - nombre: eBay (envío gratis)
    tipo: ebay
    url: https://www.ebay.com
    buscar: [pokemon psa, pokemon cgc, pokemon bgs, pokemon graded card]
    categoria: 183454                       # CCG Individual Cards
    aspectos: "Graded:{Yes},Game:{Pokémon TCG}"
    precio_max_usd: 200
    max_resultados: 400                     # por término de búsqueda
    reputacion_min: 98
    votos_min: 100
    solo_gradeadas: true
    excluir: [proxy, custom, replica, reprint, fake, orica, fan art, unofficial, metal, gold card,
              lorcana, yugioh, yu gi oh, one piece, magic, mtg, dragon ball, digimon]
    activa: false

  # Amazon y AliExpress no se escanean: sus webs bloquean lecturas automáticas (captcha) y sus
  # APIs piden cuenta de afiliado. En AliExpress casi todas las cartas y slabs "Pokémon" son
  # falsificaciones o proxies, y no hay filtro fiable de vendedor original.

  # Sodimac no tiene buscador propio con Pokémon: sus productos salen en Falabella.
  # Coolbox (VTEX) solo vende videojuegos de Pokémon, no TCG.

  # Raymi Store: sellados en "tcg" y cartas sueltas y gradeadas (PSA, CGC, AGS…) en "cards".
  # Desde nov 2026 su API vuelve a responder. Vende otros TCG, que se excluyen.
  - nombre: Raymi Store
    tipo: woocommerce
    url: https://raymistore.pe
    categorias: [tcg, cards]
    excluir: [lorcana, yugioh, yu gi oh, digimon, one piece, dragon ball, magic, mtg, union arena,
              dragona, weiss, gundam, star wars, naruto]

  # Esta tienda bloquea accesos automáticos (Cloudflare). No se escanea; queda aquí como
  # referencia para revisarla a mano.

  - nombre: Dranzer Store
    tipo: woocommerce
    url: https://dranzerstore.com
    categorias: [pokemon-tcg]
    activa: false

